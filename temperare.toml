# Mortar's rule file for tm check: every clippy warning is an error, over all targets, except two lints Mortar
# allows (result_large_err: refusals carry their reasons and next steps by design; module_inception: files and
# folders are named after their symbol and module path).
version = 1
owner = "orc"

[[rule]]
id = "clippy-warnings"
engine = "clippy"
check = "warnings"
severity = "error"
params = { allow = ["clippy::result_large_err", "clippy::module_inception"] }
fix = "Fix the warning in your own crate, or allow it at the line with a comment saying why."
